<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!-- Demande au navigateur de ne pas garder cette page en cache. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Algocadabra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- Couleur de fond en attendant la feuille de style, pour éviter un flash blanc. -->
  <style>body { margin: 0; background: #140b33; }</style>
</head>
<body>
  <div id="app"></div>

  <!-- La liste des fichiers du site est dans js/fichiers.js : cette page n'a jamais besoin de changer.
       Chaque fichier est demandé avec un ?v= différent à chaque visite : le navigateur ne peut pas
       ressortir une ancienne version de son cache, même juste après une mise à jour. -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'js/fichiers.js' + (location.protocol === 'file:' ? '' : '?v=' + Date.now());
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
